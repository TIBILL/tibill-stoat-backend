name: Build tibill images

# Builds the autumn image from this fork (upstream plus the tibill tweaks).
# Only linux/amd64, only the file server; every other service runs the
# upstream image in the self-hosted compose.

on:
  push:
    branches:
      - tibill
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-tibill-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/tibill/tibill-stoat-base
  AUTUMN_IMAGE: ghcr.io/tibill/tibill-stoat-autumn

jobs:
  publish:
    name: Build and publish autumn
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          sha="${GITHUB_SHA::8}"
          echo "version=${version}-tibill-${sha}" >> "$GITHUB_OUTPUT"

      # Builds every binary once, same Dockerfile as upstream
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            CARGO_BUILD_JOBS=4
          tags: |
            ${{ env.BASE_IMAGE }}:latest
            ${{ env.BASE_IMAGE }}:${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=tibill-base
          cache-to: type=gha,scope=tibill-base,mode=max

      # The autumn Dockerfile pulls ghcr.io/stoatchat/base:latest; the named
      # build context below swaps it for the image built above.
      - name: Build autumn image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/services/autumn/Dockerfile
          push: true
          platforms: linux/amd64
          build-contexts: |
            ghcr.io/stoatchat/base:latest=docker-image://${{ env.BASE_IMAGE }}:${{ steps.tags.outputs.version }}
          tags: |
            ${{ env.AUTUMN_IMAGE }}:latest
            ${{ env.AUTUMN_IMAGE }}:tibill
            ${{ env.AUTUMN_IMAGE }}:${{ steps.tags.outputs.version }}
